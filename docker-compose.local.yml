# 本地开发专用：只跑 MySQL + Redis + Java Backend，不跑旧 Python Agent
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_assessment
      MYSQL_ROOT_PASSWORD: dev123456
      TZ: Asia/Shanghai
    volumes:
      - assessment-mysql:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "3306:3306"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - assessment-redis:/data
    restart: unless-stopped

  backend:
    build: ./backend-java
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_assessment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: dev123456
      REDIS_HOST: redis
      AGENT_BASE_URL: http://localhost:8090
      AGENT_SERVICE_TOKEN: dev-token-123456
      CORS_ORIGINS: http://localhost:8088,http://localhost:3000,http://localhost:4173
    ports:
      - "8080:8080"
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped

volumes:
  assessment-mysql:
  assessment-redis:
